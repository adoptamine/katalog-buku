<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handcrafts</title>
<link rel="icon" href="/images/logo-rhp.png">
<link rel="stylesheet" href="/site.css">
<style>
:root{--bg:#fff6df;--tint:#fdebc4;--card:#fff;--ink:#1c2b7a;--mute:#5a5f7a;--line:#e8d9b5;--acc:#1c2b7a;--accink:#fff;--thbg:#101010;--font:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 48px}
h1{font:800 clamp(1.35rem,4.6vw,2rem)/1.15 var(--font);margin:0 0 6px;color:var(--acc)}
.hero{display:flex;align-items:center;gap:16px;background:var(--tint);border-radius:16px;padding:18px;margin-bottom:18px}
.logo{width:72px;height:72px;flex:none;border-radius:50%}
.hero .sub{margin:0;max-width:none}
.hero>div{flex:1;min-width:0}
h2{font:700 1.35rem/1.2 var(--font);margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;max-width:56ch}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.sec{margin-top:30px}
input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.chips{display:flex;gap:6px}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip[hidden]{display:none}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{display:flex;align-items:center;gap:12px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.cat[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.ico{position:relative;flex:none;width:52px;height:52px;border-radius:6px;overflow:hidden;display:grid;place-items:center;color:#fff;font:700 1rem var(--font)}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ico.ok span{display:none}
.ico.ok img{background:var(--card)}
.ct b{display:block;font:700 1rem/1.25 var(--font)}
.ct small{color:var(--mute);font-size:.82rem}
.count{color:var(--mute);font-size:.9rem;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.book{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cover{position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 12px 14px 26px;color:#fff;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:rgba(0,0,0,.28);box-shadow:inset -2px 0 0 rgba(255,255,255,.14)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover b{font:700 1.05rem/1.2 var(--font)}
.cover i{font:.8rem/1.3 var(--font);opacity:.85;margin-top:6px;font-style:normal}
.has-img .cover::before,.has-img .cover b,.has-img .cover i{display:none}
.sold .cover{filter:grayscale(.85) brightness(.8)}
.stamp{position:absolute;z-index:2;top:34%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid #fff;color:#fff;padding:4px 12px;font:700 1.1rem var(--font);border-radius:4px;background:rgba(162,59,59,.88)}
.info{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:none}
.has-img .meta{display:block}
.meta .t{font:700 .95rem/1.25 var(--font)}
.meta .a{color:var(--mute);font-size:.82rem}
.price{font-weight:800;color:var(--acc)}
.sold .price{color:var(--mute);text-decoration:line-through}
.kode{color:var(--mute);font-size:.8rem;line-height:1.35}
.lang{display:inline-block;font-size:.72rem;font-weight:700;color:var(--acc);background:var(--tint);border-radius:999px;padding:2px 9px}
.acts{margin-top:auto;display:flex;gap:8px}
.act{flex:1;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;text-decoration:none}
.act svg{width:22px;height:22px;fill:currentColor}
.wa{background:#1fa855}
.th{background:var(--thbg)}
.sp{background:#ee4d2d}
.note{color:var(--mute);font-size:.76rem;line-height:1.3;margin-top:-4px}
.done{margin-top:auto;display:block;text-align:center;padding:10px;border-radius:8px;color:var(--mute);border:1px dashed var(--line)}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--mute)}
.foot{margin-top:32px;color:var(--mute);font-size:.88rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:22px}
.pg{min-width:40px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pg.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.pg:disabled{opacity:.4;cursor:default}
.pgdot{color:var(--mute);padding:0 4px}
.cover{cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:rgba(18,35,77,.55);display:flex;overflow-y:auto;overscroll-behavior:contain;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mbox{position:relative;margin:auto;background:var(--card);border-radius:16px;max-width:780px;width:100%;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mslide{position:relative;aspect-ratio:3/4;background:var(--tint);overflow:hidden;touch-action:pan-y}
.mslide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mfall{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff}
.mfall b{font:700 1.3rem/1.2 var(--font)}
.mfall i{font-style:normal;opacity:.85;margin-top:6px}
.mload{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:.9rem}
.mnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mprev{left:10px}
.mnext{right:10px}
.mcount{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(18,35,77,.72);color:#fff;font-size:.78rem;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);font-size:1.1rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.minfo{padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.minfo h3{font:800 1.25rem/1.25 var(--font);margin:0;padding-right:36px;color:var(--acc)}
.ma{color:var(--mute)}
.mprice{font-weight:800;font-size:1.3rem;color:var(--acc)}
.mprice.sold{color:var(--mute);text-decoration:line-through}
.modal[hidden],.mfall[hidden],.mload[hidden],.mnav[hidden],.mcount[hidden],.mslide img[hidden]{display:none}
#toast{z-index:60}
@media (max-width:640px){.mbox{grid-template-columns:1fr}.mslide{aspect-ratio:auto;height:55vh;height:55svh;max-height:480px}}
.copylink{align-self:flex-start;padding:8px 14px;border:1px dashed var(--acc);border-radius:10px;background:transparent;color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
.hero{background:#fff;border:2px solid #1c2b7a;border-radius:14px}
.book,.cat{border-color:#e8d9b5;border-radius:12px}

/* ===== TAMBAHAN: sidebar filter + filter harga ===== */
.wrap{max-width:1180px}
.pricebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 0}
.plabel{font-weight:700;color:var(--acc)}
.prp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;height:42px;color:var(--mute)}
.prp input{width:96px;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start;margin-top:24px}
.layout .sec{margin-top:0}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.sidehead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sidehead b{font:800 1.1rem var(--font);color:var(--acc)}
.rst{background:none;border:0;color:var(--acc);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline}
.fg{padding:14px 0;border-bottom:1px solid var(--line)}
.fg:last-child{border-bottom:0;padding-bottom:0}
.fg h3{font:800 .78rem var(--font);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:var(--acc)}
.ck{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;color:var(--ink);font-size:.92rem}
.ck input{width:18px;height:18px;accent-color:var(--acc);margin:0;cursor:pointer}
.ck .n{margin-left:auto;color:var(--mute);font-size:.78rem}
.ftoggle{display:none;margin-top:14px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .ftoggle{display:inline-block}
  .side{display:none;position:static;max-height:none}
  .side.open{display:block}
}

/* ===== TAMBAHAN: kartu buku gaya baru + animasi hover ===== */
.book{--bkdark:var(--acc);background:var(--bkdark);border:1px solid var(--line);border-radius:18px;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;animation:bkrise .5s backwards}
.book:nth-child(3n+2){animation-delay:.06s}
.book:nth-child(3n+3){animation-delay:.12s}
.book:hover,.book:focus-within{transform:translateY(-6px);box-shadow:0 18px 30px -16px rgba(28,43,122,.55)}
.bk-top{position:relative;background:var(--tint);padding:26px 0 22px;display:grid;place-items:center}
.bk-badge{position:absolute;top:12px;left:12px;z-index:3;background:#fff;color:#1a7f45;font:800 .74rem var(--font);border-radius:999px;padding:4px 12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bk-badge.is-sold{color:#a23b3b}
.book .bk-top .cover{width:62%;aspect-ratio:3/4;padding:14px 12px 12px 22px;justify-content:space-between;border-radius:3px 9px 9px 3px;box-shadow:6px 10px 18px -6px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.book:hover .bk-top .cover{transform:translateY(-4px) rotate(-2deg) scale(1.04);box-shadow:10px 16px 24px -8px rgba(0,0,0,.5)}
.book .bk-top .cover::before{width:8px}
.book .cover b{font:800 1.02rem/1.15 var(--font);text-transform:uppercase;letter-spacing:.02em}
.book .cover i{font:700 .58rem/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-top:0}
.bk-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:2px;flex:1;color:#fff}
.bk-title{font:800 1.05rem/1.25 var(--font);margin:0;color:#fff;overflow-wrap:anywhere}
.bk-author{font-size:.86rem;color:rgba(255,255,255,.75)}
.bk-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 14px}
.bk-price{font:800 1.2rem var(--font);color:var(--tint)}
.sold .bk-price{text-decoration:line-through;opacity:.6}
.bk-cond{font-size:.78rem;color:rgba(255,255,255,.75);text-align:right;line-height:1.25}
.bk-btn{margin-top:auto;width:100%;background:transparent;color:var(--tint);border:1.5px solid rgba(253,235,196,.6);border-radius:12px;padding:10px;font:800 .9rem var(--font);cursor:pointer;transition:background .2s,color .2s,transform .2s,border-color .2s}
.book:hover .bk-btn,.bk-btn:hover{background:var(--tint);color:var(--acc);border-color:var(--tint)}
.bk-btn:active{transform:scale(.97)}
@keyframes bkrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== TAMBAHAN: pop up detail ===== */
.mbox{animation:mpop .25s ease-out}
@keyframes mpop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.buy{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.buyh{font:800 .78rem var(--font);letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--acc)}
.buylist{display:grid;gap:8px}
.buylist .act{display:flex;align-items:center;justify-content:flex-start;gap:10px;height:auto;padding:12px 16px;font-weight:800;font-size:.95rem;transition:transform .15s,filter .15s}
.buylist .act:hover{transform:translateY(-2px);filter:brightness(1.12)}
.buylist .act small{margin-left:auto;font-weight:700;opacity:.9;font-size:.82rem}
.buy .note{margin-top:10px}
.copylink{transition:background .2s,color .2s}
.copylink:hover{background:var(--acc);color:#fff}
@media (prefers-reduced-motion:reduce){.book,.book .cover,.bk-btn,.mbox,.buylist .act{transition:none!important;animation:none!important}.book:hover{transform:none}}
@media (max-width:640px){.bk-body{padding:12px}.bk-meta{flex-direction:column;align-items:flex-start;gap:2px}.bk-cond{text-align:left}.bk-top{padding:22px 0 18px}.book .bk-top .cover{width:70%}}

/* ===== HANDCRAFTS: varian (titik warna / lencana) ===== */
.vr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.vd{display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);flex:none}
.vd.out{opacity:.4;background-image:linear-gradient(135deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%)}
.vb{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;border:1.5px solid rgba(253,235,196,.6);color:var(--tint);font:800 .72rem/1 var(--font)}
.vb.out{opacity:.4;text-decoration:line-through}
.vm{font-size:.74rem;font-weight:700;color:rgba(255,255,255,.75)}
.vpick{margin:6px 0 2px}
.vopts{display:flex;flex-wrap:wrap;gap:8px}
.vo{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 7px;font:700 .88rem var(--font);color:var(--ink);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.vo.t{padding:8px 16px}
.vo .vd{width:22px;height:22px;border-color:rgba(0,0,0,.25)}
.vo.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.vo:hover:not(.out){border-color:var(--acc)}
.vo.out{opacity:.5;cursor:not-allowed}
.vo.out span{text-decoration:line-through}
.vo em{font-style:normal;color:var(--mute);font-size:.72rem;font-weight:600}

/* ===== penyesuaian agar rapi di dalam .sh-main ===== */
.sh-main .foot{margin-top:32px;max-width:none}
.sh-main .count{margin:8px 0 16px;max-width:none}
</style>
</head>
<body class="sh-page sh-preloved">
<script src="/site.js"></script>
<main class="sh-main">
  <section class="sh-banner">
    <img src="/images/crafts/banner.png" alt="" onerror="this.remove()">
  </section>
  <h2 class="sh-title">List of Items</h2>

  <input type="search" id="q" placeholder="Cari produk, material, atau warna" aria-label="Cari produk, material, atau warna">

  <div class="pricebar">
    <span class="plabel">Harga</span>
    <label class="prp">Rp <input type="number" id="pmin" min="0" step="1000" placeholder="Min" aria-label="Harga minimum"></label>
    <span class="plabel">–</span>
    <label class="prp">Rp <input type="number" id="pmax" min="0" step="1000" placeholder="Maks" aria-label="Harga maksimum"></label>
    <div class="chips" id="pchips">
      <button class="chip" data-min="" data-max="50000" aria-pressed="false">&lt; 50rb</button>
      <button class="chip" data-min="50000" data-max="100000" aria-pressed="false">50–100rb</button>
      <button class="chip" data-min="100000" data-max="" aria-pressed="false">&gt; 100rb</button>
    </div>
  </div>

  <button class="chip ftoggle" id="ftoggle" aria-expanded="false">☰ Filter produk</button>

  <div class="layout">
    <aside class="side" id="side" aria-label="Filter produk">
      <div class="sidehead"><b>Filter Produk</b><button class="rst" id="reset">Reset semua</button></div>
      <div id="filters"></div>
    </aside>

    <section class="sec" id="semua" aria-labelledby="h-semua">
      <h2 id="h-semua">Semua produk</h2>
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>

  <p class="foot">Stok diperbarui berkala. Harga di Shopee sudah ditambah 10% biaya admin Shopee. Produk yang sudah terjual tetap ditampilkan sebagai referensi.</p>
</main>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbox">
    <button class="mclose" id="mclose" aria-label="Tutup">✕</button>
    <div class="mslide" id="mslide">
      <img id="mimg" alt="" hidden>
      <div class="mfall" id="mfall" hidden></div>
      <div class="mload" id="mload">Memuat foto…</div>
      <button class="mnav mprev" id="mprev" aria-label="Foto sebelumnya" hidden>‹</button>
      <button class="mnav mnext" id="mnext" aria-label="Foto berikutnya" hidden>›</button>
      <div class="mcount" id="mcount" hidden></div>
    </div>
    <div class="minfo" id="minfo"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// ====== ISI 3 BARIS INI ======
// Nomor WhatsApp: format internasional tanpa + atau spasi (contoh: 6281234567890)
var WA = "6285791944282";
// Username Threads tanpa tanda @ (contoh: tokobukumu)
var THREADS_USER = "adopt.a.mine";
// Link toko Shopee, dipakai kalau sebuah buku belum punya link Shopee sendiri
var SHOPEE_SHOP = "https://shopee.co.id/shop/24761013";
// ===== pengali harga Shopee (1.1 = harga + 10% admin) =====
var SHOPEE_MARKUP = 1.1;
// ===== DATA DARI GOOGLE SHEETS (opsional) =====
// Tempel link CSV dari Google Sheets (File > Share > Publish to web > CSV) di antara tanda kutip.
// Kalau dikosongkan, katalog memakai daftar BOOKS yang ada di file ini.
var SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_jjttJbEDsNQCJOcDTMZt_YPhvgGVCk_kIe-xa3Ikwevg5pTTJEOCrwBlet7Xxu4O6B0Zz0cMYN_Z/pub?gid=1598916278&single=true&output=csv";
// ===== urutan kategori (opsional) =====
// Isi nama kategori sesuai urutan yang kamu mau, contoh: ["Teenlit","CTM","Rare Finds"]
// Kategori yang tidak ditulis di sini tampil setelahnya, sesuai urutan kemunculan di daftar buku.
var CATEGORY_ORDER = [];
// ===== FOTO (opsional) =====
// Foto sampul buku : images/buku/<kode huruf kecil>.jpg      contoh: images/buku/b-001.jpg
// Logo kategori    : images/kategori/<nama kategori>.png     contoh: images/kategori/ctm.png
//   (nama kategori ditulis huruf kecil, spasi dan simbol jadi tanda hubung: "Rare Finds" jadi rare-finds)
// Kalau fotonya belum ada, otomatis tampil blok warna seperti biasa.
// Format: [kode, judul, penulis, harga, status, kategori, link Shopee buku ini (boleh dikosongkan)]
// status: "ready" atau "sold"
// Kategori baru otomatis muncul di bagian Kategori begitu ada buku yang memakainya.
// Satu buku boleh masuk beberapa kategori, pisahkan dengan |  contoh: "CTM | New Arrival!"
// Warna sampul (kalau belum ada foto) mengikuti kategori pertama.

function parseVariants(raw){
  return String(raw || "").split("|").map(function(p){return p.trim()}).filter(Boolean).map(function(p){
    var tk = p.split(":").map(function(x){return x.trim()}), name = tk.shift() || "", color = "", stock = null;
    var eq = name.split("=");
    if(eq.length > 1){name = eq[0].trim(); if(isHex(eq[1])) color = eq[1].trim()}
    tk.forEach(function(t){if(isHex(t)) color = t; else if(/^\d+$/.test(t)) stock = parseInt(t, 10)});
    if(!color && COLOR_MAP[name.toLowerCase()]) color = COLOR_MAP[name.toLowerCase()];
    return {name:name, color:color, stock:stock};
  }).filter(function(v){return v.name});
}
function variantsOf(b){return parseVariants(b[10])}
function variantsAreColors(b){var vs = variantsOf(b); return vs.length > 0 && vs.every(function(v){return v.color})}
// titik warna (kalau semua varian punya warna) atau lencana teks/angka
function cardVariants(b){
  var vs = variantsOf(b); if(!vs.length) return "";
  var color = variantsAreColors(b), max = 6, more = vs.length - max;
  return '<div class="vr" aria-label="Varian">' + vs.slice(0, max).map(function(v){
    var out = v.stock === 0, tip = v.name + (out ? " (habis)" : "");
    return color
      ? '<span class="vd' + (out ? ' out' : '') + '" style="background-color:' + esc(v.color) + '" title="' + esc(tip) + '"></span>'
      : '<span class="vb' + (out ? ' out' : '') + '" title="' + esc(tip) + '">' + esc(v.name) + '</span>';
  }).join("") + (more > 0 ? '<span class="vm">+' + more + '</span>' : '') + '</div>';
}
function variantPickerHTML(b){

var PER_PAGE = 20, page = 1, lastSig = "";
(function(){
  var p = new URLSearchParams(location.search);
  function lst(k){return p.get(k) ? p.get(k).split(",").filter(Boolean) : []}
  cat = lst("kat"); langSel = lst("bhs"); kondSel = lst("kond");
  var mn = p.get("min"), mx = p.get("max");
  if(mn !== null && mn !== "" && !isNaN(+mn)) pmin = +mn;
  if(mx !== null && mx !== "" && !isNaN(+mx)) pmax = +mx;
  if(p.get("cari")) query = p.get("cari");
  stSel = lst("status").filter(function(x){return x === "ready" || x === "sold"});
  var h = parseInt(p.get("hal"), 10);
  if(h > 1) page = h;
  lastSig = sigNow();
  document.getElementById("q").value = query;
  if(pmin !== null) document.getElementById("pmin").value = pmin;
  if(pmax !== null) document.getElementById("pmax").value = pmax;
  
})();
function renderPager(pages){
    try{
    var p = new URLSearchParams();
    if(cat.length) p.set("kat", cat.join(","));
    if(langSel.length) p.set("bhs", langSel.join(","));
    if(kondSel.length) p.set("kond", kondSel.join(","));
    if(pmin !== null) p.set("min", pmin);
    if(pmax !== null) p.set("max", pmax);
    if(query.trim()) p.set("cari", query.trim());
    if(stSel.length) p.set("status", stSel.join(","));
    if(page > 1) p.set("hal", page);
    var qs = p.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
  }catch(err){}
  var el = document.getElementById("pager");
  if(pages < 2){el.innerHTML = ""; return}
  var nums = [];
  for(var i = 1; i <= pages; i++){
    if(i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if(nums[nums.length - 1] !== "…") nums.push("…");
  }
  el.innerHTML = '<button class="pg" data-p="' + (page - 1) + '"' + (page === 1 ? " disabled" : "") + ' aria-label="Halaman sebelumnya">‹</button>' +
    nums.map(function(n){
      return n === "…" ? '<span class="pgdot">…</span>'
        : '<button class="pg' + (n === page ? " on" : "") + '" data-p="' + n + '"' + (n === page ? ' aria-current="page"' : "") + '>' + n + '</button>';
    }).join("") +
    '<button class="pg" data-p="' + (page + 1) + '"' + (page === pages ? " disabled" : "") + ' aria-label="Halaman berikutnya">›</button>';
}
document.getElementById("pager").addEventListener("click", function(e){
  var b = e.target.closest(".pg"); if(!b || b.disabled) return;
  page = +b.getAttribute("data-p");
  render(); toList();
});
function render(){
  var q = query.trim().toLowerCase();
  var list = BOOKS.filter(function(b){
    if(cat.length && !catsOf(b).some(function(c){return cat.indexOf(c) > -1})) return false;
    if(langSel.length && langSel.indexOf(langOf(b)) < 0) return false;
    if(kondSel.length && kondSel.indexOf(b[8] || "") < 0) return false;
    if(stSel.length && stSel.indexOf(b[4]) < 0) return false;
    if(pmin !== null && b[3] < pmin) return false;
    if(pmax !== null && b[3] > pmax) return false;
    return !q || (b[1] + " " + b[2] + " " + catsOf(b).join(" ") + " " + variantsOf(b).map(function(v){return v.name}).join(" ")).toLowerCase().indexOf(q) > -1;
  });
  
  
  
  var sig = sigNow();
  if(sig !== lastSig){page = 1; lastSig = sig}
  var pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if(page > pages) page = pages;
  var from = (page - 1) * PER_PAGE, pageList = list.slice(from, from + PER_PAGE);
  document.getElementById("count").textContent = list.length > PER_PAGE
    ? "Menampilkan " + (from + 1) + "–" + (from + pageList.length) + " dari " + list.length + " produk"
    : list.length + " produk";
  renderPager(pages);
  var html = pageList.map(function(b){
    var sold = b[4] === "sold", color = colorOf(catOf(b));
    var cond = (b[8] ? b[8] : "") || catsOf(b)[0];
    return '<article class="book' + (sold ? " sold" : "") + '">' +
      '<div class="bk-top"><span class="bk-badge' + (sold ? " is-sold" : "") + '">' + (sold ? "Sold" : "Tersedia") + '</span>' +
      '<div class="cover" data-k="' + esc(b[0]) + '" tabindex="0" role="button" aria-label="Lihat foto dan detail ' + esc(b[1]) + '" style="background:' + color + '">' +
      coverImg(b) +
      (sold ? '<span class="stamp">Sold</span>' : "") +
      '<b>' + esc(b[1]) + '</b><i>Rumah Hobi · ' + esc(b[0]) + '</i></div></div>' +
      '<div class="bk-body"><h3 class="bk-title">' + esc(b[1]) + '</h3><div class="bk-author">' + esc(b[2]) + '</div>' + cardVariants(b) +
      '<div class="bk-meta"><span class="bk-price">' + rp(b[3]) + '</span><span class="bk-cond">' + esc(cond) + '</span></div>' +
      '<button class="bk-btn" data-k="' + esc(b[0]) + '">Lihat detail</button></div></article>';
  }).join("");
  document.getElementById("grid").innerHTML = html || '<div class="empty">Tidak ada produk yang cocok. Coba kata kunci lain atau pilih filter Semua.</div>';
}

function sigNow(){return [cat.join(","), stSel.join(","), query.trim().toLowerCase(), langSel.join(","), kondSel.join(","), pmin, pmax].join("|")}
function selOf(g){return g === "cat" ? cat : g === "lang" ? langSel : g === "kond" ? kondSel : stSel}
function uniqs(a){return a.filter(function(x, i){return a.indexOf(x) === i})}
function renderFilters(){
  var langs = uniqs(BOOKS.map(langOf)).filter(Boolean);
  var konds = uniqs(BOOKS.map(function(b){return b[8] || ""})).filter(Boolean);
  function grp(g, title, items){
    if(!items.length) return "";
    return '<div class="fg"><h3>' + title + '</h3>' + items.map(function(it){
      return '<label class="ck"><input type="checkbox" data-g="' + g + '" value="' + esc(it.v) + '"' + (selOf(g).indexOf(it.v) > -1 ? " checked" : "") + '><span>' + esc(it.l) + '</span><span class="n">' + it.n + '</span></label>';
    }).join("") + '</div>';
  }
  document.getElementById("filters").innerHTML =
    grp("cat", "Kategori", CATS.map(function(c){return {v:c.name, l:c.name, n:c.n}})) +
    grp("lang", "Material", langs.map(function(l){return {v:l, l:l, n:BOOKS.filter(function(b){return langOf(b) === l}).length}})) +
    grp("kond", "Kondisi Buku", konds.map(function(k){return {v:k, l:k, n:BOOKS.filter(function(b){return b[8] === k}).length}})) +
    grp("st", "Ketersediaan", [
      {v:"ready", l:"Tersedia", n:BOOKS.filter(function(b){return b[4] === "ready"}).length},
      {v:"sold", l:"Sold", n:BOOKS.filter(function(b){return b[4] === "sold"}).length}]);
}

  (function next(){
    if(i >= list.length) return cb(null);
    var ext = list[i++], im = new Image();
    im.onload = function(){okExt = ext; cb(base + "." + ext)};
    im.onerror = next;
    im.src = base + "." + ext;
  })();
}
function showSlide(i){
  var n = slides.length, img = document.getElementById("mimg");
  document.getElementById("mload").hidden = true;
  document.getElementById("mfall").hidden = n > 0;
  img.hidden = !n;
  ["mprev","mnext","mcount"].forEach(function(id){document.getElementById(id).hidden = n < 2});
  if(!n) return;
  sIdx = (i + n) % n;
  img.src = slides[sIdx];
  document.getElementById("mcount").textContent = (sIdx + 1) + " / " + n;
}
function loadSlides(b, token){
  var fu = fotosOf(b);
  if(fu.length){slides = fu.slice(); showSlide(0); return}
  var base = "/images/crafts/" + encodeURIComponent(b[0].toLowerCase()), n = 1;
  (function step(){
    if(n > MAX_PHOTOS) return;
    probe(n === 1 ? base : base + "-" + n, function(url){
      if(token !== mToken) return;
      if(!url){if(!slides.length) showSlide(0); return}
      slides.push(url);
      showSlide(slides.length === 1 ? 0 : sIdx);
      n++; step();
    });
  })();
}

// ===== DATA DARI GOOGLE SHEETS =====
// Alamat CSV diisi di bagian pengaturan atas (SHEET_CSV). Kalau kosong, katalog memakai daftar BOOKS di file ini.
function parseCSV(t){
  var rows = [], row = [], f = "", q = false, c;
  t = String(t).replace(/^\uFEFF/, "");
  for(var i = 0; i < t.length; i++){
    c = t.charAt(i);
    if(q){
      if(c === '"'){if(t.charAt(i + 1) === '"'){f += '"'; i++} else q = false}
      else f += c;
    } else if(c === '"') q = true;
    else if(c === ","){row.push(f); f = ""}
    else if(c === "\n"){row.push(f); rows.push(row); row = []; f = ""}
    else if(c !== "\r") f += c;
  }
  if(f !== "" || row.length){row.push(f); rows.push(row)}
  return rows;
}
function rowsToBooks(rows){
  if(!rows.length) return null;
  var head = rows[0].map(function(h){return String(h).trim().toLowerCase()});
  function col(names){
    for(var i = 0; i < names.length; i++){var k = head.indexOf(names[i]); if(k > -1) return k}
    return -1;
  }
  var iK = col(["kode"]), iJ = col(["nama produk","judul","judul buku","nama","produk"]), iP = col(["material","bahan","penulis"]), iH = col(["harga","harga listing"]),
      iS = col(["status"]), iC = col(["kategori"]), iB = col(["bahasa"]), iL = col(["link_shopee","link shopee","link"]), iKo = col(["kondisi"]), iF = col(["foto","gambar","foto_url"]), iV = col(["varian","variant","warna"]), iD = col(["deskripsi","keterangan","catatan"]);
  if(iK < 0 || iJ < 0 || iH < 0 || iS < 0) return null;
  var get = function(r, i){return i > -1 ? String(r[i] || "").trim() : ""};
  var out = [];
  rows.slice(1).forEach(function(r){
    var kode = get(r, iK);
    if(!kode) return;
    var harga = parseInt(get(r, iH).replace(/[^0-9]/g, ""), 10) || 0;
    var row = [kode, get(r, iJ), get(r, iP), harga, /sold|terjual/i.test(get(r, iS)) ? "sold" : "ready", get(r, iC), get(r, iB)];
    var link = get(r, iL).split("?")[0];
    row.push(/^https?:/i.test(link) ? link : ""); row.push(iKo > -1 ? get(r, iKo) : ""); row.push(iF > -1 ? get(r, iF) : ""); row.push(iV > -1 ? get(r, iV) : ""); row.push(iD > -1 ? get(r, iD) : "");
    var vv = parseVariants(row[10]);
    if(vv.length && vv.every(function(v){return v.stock === 0})) row[4] = "sold"; // semua varian habis = sold
    out.push(row);
  });
  return out.length ? out : null;
}
function loadBooks(){
  if(!SHEET_CSV){renderFilters(); render(); return}
  var rendered = false;
  
  document.getElementById("grid").innerHTML = '<div class="empty">Memuat daftar buku…</div>';
  function apply(list){
    if(list){BOOKS = list; CATS = categories()}
    renderFilters(); render(); rendered = true;
    if(list) syncHash();
  }
  setTimeout(function(){if(!rendered) apply(null)}, 4000);
  fetch(SHEET_CSV).then(function(r){
    if(!r.ok) throw new Error("gagal");
    return r.text();
  }).then(function(t){
    var list = rowsToBooks(parseCSV(t));
    if(!list && window.console) console.warn("Data Google Sheets kosong atau judul kolom tidak cocok.");
    if(list || !rendered) apply(list);
  }).catch(function(){
    if(!rendered) apply(null);
  });
}
